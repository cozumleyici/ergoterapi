<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergoterapi.com.tr — Canlı Destek Yönetim Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-surface: #12141e;
            --bg-elevated: #1a1d2c;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: rgba(99, 102, 241, 0.15);
            --accent: #ff6b00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* ─── GİRİŞ EKRANI (LOGIN GATE) ─── */
        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.15);
            text-align: center;
        }
        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
        }
        .login-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .login-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .login-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
        .remember-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        .remember-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45); }
        .login-error { color: var(--danger); font-size: 13px; margin-top: 14px; display: none; }

        /* ─── ANA BAŞLIK & ÜST BAR ─── */
        .topbar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        .topbar-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .brand-info h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .brand-info span { font-size: 12px; color: var(--primary); font-weight: 600; }

        .topbar-actions { display: flex; align-items: center; gap: 10px; }
        .badge-count {
            background: var(--primary-light);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }
        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }

        /* ─── İÇERİK ALANI ─── */
        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px;
            flex: 1;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 18px;
        }
        .auto-refresh-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* ─── OTURUM LİSTESİ ─── */
        .session-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .session-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.2s;
            position: relative;
        }
        .session-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .session-card.highlight {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .user-tag {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .user-name { font-weight: 600; font-size: 15px; color: #fff; }
        .session-time { font-size: 12px; color: var(--text-muted); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: var(--danger); color: #fff; }

        /* Mesaj Balonları */
        .chat-stream {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
        }
        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.45;
        }
        .msg-visitor {
            align-self: flex-start;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }
        .msg-visitor strong {
            display: block;
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .msg-admin {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-admin strong {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Hızlı Şablon Butonları */
        .quick-templates {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .btn-template {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #cbd5e1;
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-template:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: #fff;
        }

        /* Yanıt Alanı */
        .reply-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .reply-textarea {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 70px;
            outline: none;
            transition: border 0.2s;
        }
        .reply-textarea:focus { border-color: var(--primary); }
        .reply-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-reply {
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-reply:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }

        @media (max-width: 640px) {
            .topbar-content { flex-direction: column; align-items: flex-start; }
            .topbar-actions { width: 100%; justify-content: space-between; }
            .msg-bubble { max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- ─── ŞİFRELİ GİRİŞ EKRANI ─── -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-icon">🧠</div>
            <h2>Ergoterapi.com.tr</h2>
            <p>Canlı Destek Yönetim Paneli Girişi</p>
            
            <div class="input-group">
                <label class="input-label" for="login-pass">Yönetici Şifresi</label>
                <input type="password" id="login-pass" class="login-input" placeholder="Şifrenizi girin..." autofocus />
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" id="remember-me" checked />
                    <span>Bu cihazda beni hatırla</span>
                </label>
            </div>

            <button class="btn-login" onclick="attemptLogin()">Giriş Yap 🚀</button>
            <div id="login-error" class="login-error">❌ Şifre hatalı. Lütfen tekrar deneyiniz.</div>
        </div>
    </div>

    <!-- ─── ÜST BAR ─── -->
    <header class="topbar">
        <div class="topbar-content">
            <a href="https://www.ergoterapi.com.tr" class="brand" target="_blank">
                <div class="brand-icon">🧠</div>
                <div class="brand-info">
                    <h1>Ergoterapi.com.tr</h1>
                    <span>Canlı Destek Yönetim Paneli</span>
                </div>
            </a>

            <div class="topbar-actions">
                <span class="badge-count" id="active-count">0 Aktif Konuşma</span>
                <button class="btn-secondary" onclick="loadSessions(true)">🔄 Yenile</button>
                <button class="btn-secondary" onclick="logout()" title="Çıkış Yap">🔒 Çıkış</button>
            </div>
        </div>
    </header>

    <!-- ─── İÇERİK ─── -->
    <main class="container">
        <div class="controls-bar">
            <div style="font-size: 13px; color: var(--text-muted);">
                Ziyaretçilerin web sitesinden ilettiği canlı mesajlar burada listelenir.
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
                <label class="auto-refresh-toggle">
                    <input type="checkbox" id="auto-refresh" checked onchange="toggleAutoRefresh()" />
                    <span>Otomatik Yenile (5 sn)</span>
                </label>
                <button class="btn-secondary" style="color:var(--danger); border-color:rgba(239,68,68,0.2);" onclick="clearAllSessions()">
                    🗑️ Tümünü Temizle
                </button>
            </div>
        </div>

        <div id="sessions-container" class="session-list">
            <!-- Oturumlar dinamik olarak buraya eklenecek -->
        </div>
    </main>

    <script>
        const API_URL = '/chat.php';
        let adminToken = localStorage.getItem('ergo_live_token') || sessionStorage.getItem('ergo_live_token') || '';
        let refreshTimer = null;

        // Sayfa açılışında kimlik doğrulama
        document.addEventListener('DOMContentLoaded', () => {
            // URL hash'i varsa (örn: #sess12345) o karta odaklanacağız
            if (adminToken) {
                verifyTokenAndLoad();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }

            document.getElementById('login-pass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') attemptLogin();
            });
        });

        async function attemptLogin() {
            const passInput = document.getElementById('login-pass');
            const remember = document.getElementById('remember-me').checked;
            const errEl = document.getElementById('login-error');
            const pass = passInput.value.trim();

            if (!pass) return;

            adminToken = pass;
            const success = await verifyTokenAndLoad();

            if (success) {
                if (remember) {
                    localStorage.setItem('ergo_live_token', pass);
                } else {
                    sessionStorage.setItem('ergo_live_token', pass);
                }
                document.getElementById('login-screen').style.display = 'none';
                errEl.style.display = 'none';
                startAutoRefresh();
            } else {
                adminToken = '';
                errEl.style.display = 'block';
                passInput.select();
            }
        }

        async function verifyTokenAndLoad() {
            try {
                const res = await fetch(API_URL + '?action=list_sessions', {
                    headers: { 'X-Admin-Token': adminToken }
                });
                if (res.status === 401) return false;
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('login-screen').style.display = 'none';
                    renderSessions(data.sessions || []);
                    startAutoRefresh();
                    return true;
                }
                return false;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        function logout() {
            localStorage.removeItem('ergo_live_token');
            sessionStorage.removeItem('ergo_live_token');
            adminToken = '';
            stopAutoRefresh();
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-pass').value = '';
        }

        async function loadSessions(manual = false) {
            if (!adminToken) return;
            try {
                const res = await fetch(API_URL + '?action=list_sessions', {
                    headers: { 'X-Admin-Token': adminToken }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (data.ok) {
                    renderSessions(data.sessions || []);
                }
            } catch (e) {
                console.error('Oturum yükleme hatası:', e);
            }
        }

        function renderSessions(sessions) {
            const container = document.getElementById('sessions-container');
            const countEl = document.getElementById('active-count');
            countEl.textContent = `${sessions.length} Aktif Konuşma`;

            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <h3>Henüz aktif bir canlı destek mesajı yok</h3>
                        <p>Ziyaretçiler sitedeki sohbet balonundan yazdığında mesajlar anında burada görünecektir.</p>
                    </div>
                `;
                return;
            }

            // Mevcut açık textarea içeriklerini kaybetmemek için hafızada tut
            const draftReplies = {};
            sessions.forEach(s => {
                const el = document.getElementById(`reply-${s.id}`);
                if (el && el.value) draftReplies[s.id] = el.value;
            });

            container.innerHTML = sessions.map(s => {
                const dateStr = new Date(s.time * 1000).toLocaleString('tr-TR', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });

                const repliesHtml = (s.replies || []).map(r => {
                    const rTime = r.time ? new Date(r.time * 1000).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
                    return `
                        <div class="msg-bubble msg-admin">
                            <strong>Ergoterapist Danışmanı • ${rTime}</strong>
                            <div>${escapeHtml(r.text)}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="session-card" id="card-${s.id}">
                        <div class="card-header">
                            <div class="user-tag">
                                <div class="user-avatar">👤</div>
                                <div>
                                    <div class="user-name">Ziyaretçi (#${s.id})</div>
                                    <div class="session-time">🕒 ${dateStr}</div>
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteSession('${s.id}')">🗑️ Oturumu Sil</button>
                        </div>

                        <div class="chat-stream">
                            <div class="msg-bubble msg-visitor">
                                <strong>Ziyaretçi Mesajı</strong>
                                <div>${escapeHtml(s.message)}</div>
                            </div>
                            ${repliesHtml}
                        </div>

                        <!-- Hızlı Yanıt Şablonları -->
                        <div class="quick-templates">
                            <button class="btn-template" onclick="insertTemplate('${s.id}', 'Merhaba! Size nasıl yardımcı olabiliriz?')">👋 Merhaba</button>
                            <button class="btn-template" onclick="insertTemplate('${s.id}', 'İlk değerlendirme seansımız tamamen ücretsizdir. Randevu oluşturmak ister misiniz?')">🎯 Ücretsiz Seans</button>
                            <button class="btn-template" onclick="insertTemplate('${s.id}', 'Sizi detaylı bilgilendirmek için bir telefon numarası paylaşabilir misiniz?')">📞 Telefon Talebi</button>
                            <button class="btn-template" onclick="insertTemplate('${s.id}', 'Hangi il ve ilçeden başvurduğunuzu öğrenebilir miyiz?')">📍 Konum Bilgisi</button>
                        </div>

                        <div class="reply-box">
                            <textarea id="reply-${s.id}" class="reply-textarea" placeholder="Ziyaretçiye yanıtınızı yazın... (Enter ile yeni satır)"></textarea>
                            <div class="reply-actions">
                                <span id="status-${s.id}" style="font-size:13px;"></span>
                                <button class="btn-reply" onclick="sendReply('${s.id}')">
                                    <span>📤</span> Cevap Gönder
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Varsa taslakları geri doldur
            Object.keys(draftReplies).forEach(id => {
                const el = document.getElementById(`reply-${id}`);
                if (el) el.value = draftReplies[id];
            });

            // Eğer URL'de hash (#sess_id) varsa doğrudan o karta odaklan
            const hash = window.location.hash ? window.location.hash.substring(1) : '';
            if (hash) {
                const targetCard = document.getElementById(`card-${hash}`);
                if (targetCard) {
                    targetCard.classList.add('highlight');
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const replyInput = document.getElementById(`reply-${hash}`);
                    if (replyInput) replyInput.focus();
                }
            }
        }

        function insertTemplate(sessionId, text) {
            const textarea = document.getElementById(`reply-${sessionId}`);
            if (textarea) {
                textarea.value = text;
                textarea.focus();
            }
        }

        async function sendReply(sessionId) {
            const textarea = document.getElementById(`reply-${sessionId}`);
            const statusEl = document.getElementById(`status-${sessionId}`);
            const message = textarea.value.trim();

            if (!message) {
                statusEl.innerHTML = '<span style="color:var(--danger)">Lütfen bir mesaj yazın</span>';
                return;
            }

            statusEl.innerHTML = '<span style="color:var(--text-muted)">Gönderiliyor...</span>';

            try {
                const res = await fetch(API_URL + '?action=reply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': adminToken
                    },
                    body: JSON.stringify({ session: sessionId, message: message })
                });

                const data = await res.json();
                if (data.ok) {
                    statusEl.innerHTML = '<span style="color:var(--success)">✅ Cevap iletildi!</span>';
                    textarea.value = '';
                    setTimeout(() => loadSessions(), 800);
                } else {
                    statusEl.innerHTML = '<span style="color:var(--danger)">❌ Gönderilemedi</span>';
                }
            } catch (e) {
                statusEl.innerHTML = '<span style="color:var(--danger)">❌ Bağlantı hatası</span>';
            }
        }

        async function deleteSession(sessionId) {
            if (!confirm('Bu canlı destek oturumunu silmek istediğinizden emin misiniz?')) return;

            try {
                const res = await fetch(API_URL + '?action=delete_session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': adminToken
                    },
                    body: JSON.stringify({ session: sessionId })
                });
                const data = await res.json();
                if (data.ok) {
                    loadSessions();
                } else {
                    alert('Silme işlemi başarısız');
                }
            } catch (e) {
                alert('Bağlantı hatası oluştu');
            }
        }

        async function clearAllSessions() {
            if (!confirm('TÜM sohbet oturumlarını silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.')) return;

            try {
                const res = await fetch(API_URL + '?action=clear_sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': adminToken
                    }
                });
                const data = await res.json();
                if (data.ok) {
                    loadSessions();
                }
            } catch (e) {
                alert('Bağlantı hatası');
            }
        }

        function toggleAutoRefresh() {
            const enabled = document.getElementById('auto-refresh').checked;
            if (enabled) startAutoRefresh();
            else stopAutoRefresh();
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshTimer = setInterval(() => loadSessions(), 5000);
        }

        function stopAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
